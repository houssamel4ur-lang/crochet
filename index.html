*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}img{max-width:100%;display:block}header{background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}.nav{max-width:1200px;margin:auto;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font:700 29px Georgia,serif;color:var(--green)}.links{display:flex;gap:22px;flex-wrap:wrap;font-size:14px;font-weight:600}.links a:hover,.text-link:hover{color:var(--green)}.container{max-width:1200px;margin:auto;padding:0 22px}.hero{background:linear-gradient(110deg,#e9eee3,#f7e6db);padding:75px 0}.hero-inner{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:55px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800;color:var(--green)}h1,h2,h3{font-family:Georgia,serif;line-height:1.2}h1{font-size:clamp(40px,5.6vw,70px);margin:12px 0 20px}h2{font-size:clamp(28px,3vw,39px)}.hero p{font-size:18px;color:#566358;max-width:560px}.hero img{height:370px;width:100%;object-fit:cover;border-radius:170px 170px 24px 24px}.btn{display:inline-block;border:0;background:var(--green);color:#fff;padding:13px 23px;border-radius:30px;font-weight:700}.btn:hover{background:#4d614a}.section{padding:65px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin-bottom:26px}.section-head h2{margin:5px 0}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 28px}.search{flex:1;min-width:210px;padding:13px 17px;border:1px solid var(--line);border-radius:30px;background:#fff}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{padding:10px 16px;border-radius:30px;border:1px solid #d9dfd6;background:#fff;color:var(--ink)}.chip.active{background:var(--green);color:#fff}.category-section{padding:55px 0;border-top:1px solid var(--line)}.category-section:nth-child(even){background:#ffffff88}.category-section .section-head{margin-bottom:22px}.category-section .grid{margin-top:14px}.category-section .btn{padding:9px 18px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 6px 20px #27392a0a}.card img{height:225px;width:100%;object-fit:cover}.card-body{padding:21px}.tag{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--green)}.card h3{font-size:23px;margin:10px 0}.card p{color:var(--muted);font-size:14px}.meta{font-size:13px;color:var(--muted);margin-top:16px}.text-link{color:var(--green);font-weight:800}.feature{background:#e9eee3}.feature-inner{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}.feature img{height:330px;width:100%;object-fit:cover;border-radius:20px}.feature p{color:var(--muted)}.newsletter{background:var(--pink);text-align:center;padding:65px 22px}.newsletter p{color:var(--muted)}.newsletter form{display:flex;gap:10px;max-width:490px;margin:20px auto;flex-wrap:wrap}.newsletter input{flex:1;min-width:200px;border:1px solid #e2d5cb;border-radius:30px;padding:13px 18px}.notice{font-size:13px;color:var(--muted)}footer{background:#29372d;color:#fff;padding:45px 22px}footer .footer-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:25px;flex-wrap:wrap}footer p{color:#d1dbd0}footer a{margin-right:16px;font-size:14px}.article{max-width:790px;margin:45px auto 80px;padding:0 22px}.article h1{font-size:clamp(34px,5vw,55px)}.article h2{font-size:29px;margin-top:36px}.article p,.article li{line-height:1.9}.article img{border-radius:18px;width:100%;max-height:420px;object-fit:cover;margin:24px 0}.article .back{display:inline-block;margin-bottom:20px;color:var(--green);font-weight:700}.article .disclaimer{padding:16px;border-left:4px solid var(--green);background:#eef2ea}.empty{padding:30px;text-align:center;color:var(--muted)}:focus-visible{outline:3px solid #b58a60;outline-offset:3px}
@media(max-width:800px){.hero-inner,.feature-inner{grid-template-columns:1fr}.hero{padding:45px 0}.hero img{height:270px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.links{gap:12px}.nav{padding:12px 18px}.section{padding:45px 0}.hero p{font-size:16px}}
:root{--heading-font:Georgia,serif;--body-font:system-ui,-apple-system,Segoe UI,sans-serif;--corner-radius:17px}body{font-family:var(--body-font)}h1,h2,h3{font-family:var(--heading-font)}.card{border-radius:var(--corner-radius)}.feature img,.article img{border-radius:var(--corner-radius)}.brand-logo{max-height:52px;max-width:190px;object-fit:contain}

<body>
<header><nav class="nav" aria-label="Main navigation"><a class="brand" href="#home">CozyLoops ♡</a><div class="links"><a href="#home">Home</a><a href="#articles">Articles</a><a href="#categories">Categories</a><a href="#about">About</a><a href="#contact">Contact</a></div></nav></header>
<main id="app"></main>
<footer><div class="footer-inner"><div><a class="brand" href="#home">CozyLoops ♡</a><p>Slow down, pick up your yarn, and create something lovely.</p></div><div><a href="#about">About</a><a href="#contact">Contact</a><a href="#privacy">Privacy</a><a href="#terms">Terms</a></div></div></footer>
<script>
const siteTheme={site_name:'CozyLoops',site_description:'Discover free crochet patterns, beginner tutorials, amigurumi ideas and crochet tips at CozyLoops.'};
const themeEndpoint='https://yqmrunstyhrhnvxoyrap.supabase.co/rest/v1/site_settings?id=eq.1&select=site_name,site_description,logo_url,favicon_url,primary_color,secondary_color,background_color,text_color,heading_font,body_font,border_radius';
const themeKey='sb_publishable_HqkcpvBz8P8KJTZFgefrWQ_rFxKPMNh';
function validColor(value){return typeof value==='string'&&/^#[0-9a-f]{6}$/i.test(value)}
function fontChoice(value,fallback){const allowed={Georgia:'Georgia,serif',Arial:'Arial,sans-serif','Times New Roman':'"Times New Roman",serif',Verdana:'Verdana,sans-serif',Tahoma:'Tahoma,sans-serif','Trebuchet MS':'"Trebuchet MS",sans-serif','Courier New':'"Courier New",monospace',system:'system-ui,-apple-system,Segoe UI,sans-serif'};return allowed[value]||fallback}
function safeHttps(value){try{const u=new URL(value);return u.protocol==='https:'?u.href:null}catch{return null}}
function applyTheme(t){
  if(!t)return;
  if(typeof t.site_name==='string'&&t.site_name.trim())siteTheme.site_name=t.site_name.trim().slice(0,120);
  if(typeof t.site_description==='string'&&t.site_description.trim())siteTheme.site_description=t.site_description.trim().slice(0,500);
  const root=document.documentElement.style;
  if(validColor(t.primary_color))root.setProperty('--green',t.primary_color);
  if(validColor(t.secondary_color))root.setProperty('--pink',t.secondary_color);
  if(validColor(t.background_color))root.setProperty('--cream',t.background_color);
  if(validColor(t.text_color))root.setProperty('--ink',t.text_color);
  root.setProperty('--heading-font',fontChoice(t.heading_font,'Georgia,serif'));
  root.setProperty('--body-font',fontChoice(t.body_font,'system-ui,-apple-system,Segoe UI,sans-serif'));
  if(Number.isInteger(t.border_radius)&&t.border_radius>=0&&t.border_radius<=50)root.setProperty('--corner-radius',t.border_radius+'px');
  const logo=safeHttps(t.logo_url);
  document.querySelectorAll('.brand').forEach(el=>{el.replaceChildren();if(logo){const img=document.createElement('img');img.src=logo;img.alt=siteTheme.site_name;img.className='brand-logo';el.append(img)}else{el.textContent=siteTheme.site_name+' ♡'}});
  const favicon=safeHttps(t.favicon_url);
  if(favicon){let link=document.querySelector('link[rel="icon"]');if(!link){link=document.createElement('link');link.rel='icon';document.head.append(link)}link.href=favicon}
  document.querySelector('meta[name="theme-color"]').content=validColor(t.primary_color)?t.primary_color:'#75866f';
  route();
}
async function loadTheme(){
  try{
    const res=await fetch(themeEndpoint,{headers:{apikey:themeKey}});
    if(!res.ok)throw Error('Theme request failed');
    const rows=await res.json();
    if(Array.isArray(rows)&&rows[0])applyTheme(rows[0]);
  }catch(err){console.warn('Using default theme:',err.message)}
}
const imageBase="https://images.unsplash.com/";
const posts=[
{slug:"crochet-for-absolute-beginners",title:"Crochet for Absolute Beginners: Your First Steps",category:"Beginner Tutorials",date:"November 3, 2026",minutes:7,image:imageBase+"photo-1606761568499-6d2451b23c66?w=1000",excerpt:"Learn what you need to start crocheting, from yarn and hooks to your first simple stitches.",sections:[["What You Need","Start with medium-weight yarn, a comfortable hook that matches your yarn label, scissors, and a yarn needle. Light-colored yarn makes stitches easier to see."],["Make a Slip Knot","Form a loop with your yarn, pull a strand through it, and gently tighten the knot around your hook. Keep it loose enough to slide."],["Practice Chain Stitches","Wrap the working yarn over your hook and pull it through the loop. Repeat to make a chain. Try making 20 chains with an even tension."],["Try Single Crochet","Insert the hook into the second chain from your hook, yarn over and pull up a loop. Yarn over again and pull through both loops. Repeat along the row."],["Your Next Project","Make a small square or washcloth to practice. Count your stitches at the end of each row and take your time."]]},
{slug:"how-to-read-crochet-patterns",title:"How to Read a Crochet Pattern Without Stress",category:"Crochet Tips",date:"November 3, 2026",minutes:6,image:imageBase+"photo-1494438639946-1ebd1d20bf85?w=1000",excerpt:"Understand common abbreviations, repeats and pattern notes before your next project.",sections:[["Start With the Notes","Check the recommended yarn, hook size, gauge, finished measurements and terminology. US and UK crochet stitch names can differ."],["Common US Abbreviations","ch means chain, sc means single crochet, dc means double crochet, st means stitch, sl st means slip stitch, and rep means repeat."],["Understanding Repeats","Instructions in parentheses or brackets often indicate a group of stitches to repeat. Always check the stitch count at the end of each row or round."],["Read One Row at a Time","Mark completed rows, use a stitch marker, and write down any changes you make to yarn or hook size."]]},
{slug:"easy-crochet-scarf-guide",title:"Easy Crochet Scarf: A Simple Project Plan",category:"Free Patterns",date:"November 3, 2026",minutes:8,image:imageBase+"photo-1606761568499-6d2451b23c66?w=1000",excerpt:"Plan a beginner-friendly scarf using a simple repeat and learn how to adjust the size.",sections:[["Materials","Choose approximately 300–450 yards of medium-weight yarn for a basic adult scarf, depending on desired dimensions and stitch tension. Use the hook size recommended on the yarn label."],["Make Your Foundation","Chain until the foundation is approximately as wide as you want the scarf. Make one extra chain for turning."],["Work the Rows","Single crochet in the second chain from your hook and in each chain across. Chain one, turn, and single crochet across each row. Repeat until the scarf reaches your preferred length."],["Finish Your Scarf","Fasten off, weave in the ends securely, and gently block according to your yarn's care instructions."]]},
{slug:"amigurumi-basics",title:"Amigurumi Basics: Make Your First Crochet Toy",category:"Amigurumi",date:"November 3, 2026",minutes:7,image:imageBase+"photo-1559454403-b8fb88521f11?w=1000",excerpt:"Discover the essential techniques behind cute crocheted toys and stuffed animals.",sections:[["Choose Your Supplies","Use smooth yarn, a hook slightly smaller than the yarn label recommends, stitch markers, stuffing and a yarn needle."],["Learn the Magic Ring","A magic ring lets you begin working in the round with a small center opening. You can also start with a short chain ring."],["Increase and Decrease","An increase places two stitches into one stitch. An invisible decrease joins two stitches into one to shape your toy."],["Keep Track of Rounds","Move your stitch marker at the beginning of every round and count stitches regularly."],["Toy Safety","For toys intended for babies or young children, avoid detachable decorations and plastic safety eyes; securely embroidered features are generally preferable."]]},
{slug:"choosing-crochet-yarn",title:"How to Choose the Right Yarn for Crochet",category:"Crochet Tips",date:"November 3, 2026",minutes:5,image:imageBase+"photo-1606761568499-6d2451b23c66?w=1000",excerpt:"Compare yarn weight, fiber, texture and care instructions for your crochet projects.",sections:[["Understand Yarn Weight","Yarn weight describes thickness, not the weight of the whole skein. Check the label for recommended hook sizes and gauge."],["Compare Fibers","Cotton is popular for washcloths and summer projects. Wool is warm and elastic. Acrylic is often affordable and easy to care for."],["Match Yarn to the Project","Choose soft, washable yarn for everyday items and consider drape, durability and care before starting."],["Make a Swatch","A small test square helps you check stitch definition, fabric feel and finished size."]]},
{slug:"crochet-stitch-counting",title:"5 Easy Ways to Keep Your Crochet Stitches Even",category:"Beginner Tutorials",date:"November 3, 2026",minutes:5,image:imageBase+"photo-1494438639946-1ebd1d20bf85?w=1000",excerpt:"Simple habits to help avoid uneven edges, lost stitches and frustrating do-overs.",sections:[["Count Every Row","Count stitches at the end of each row, especially when learning a new pattern."],["Use Stitch Markers","Mark the first and last stitch to help keep edges straight."],["Watch Your Tension","Hold yarn comfortably and try to keep your loops consistent without pulling too tightly."],["Check Turning Chains","Read whether the pattern counts the turning chain as a stitch."],["Practice Slowly","Accuracy comes before speed. Small swatches are an excellent way to build muscle memory."]]}
];
const categories=["All","Beginner Tutorials","Free Patterns","Amigurumi","Crochet Tips"];
async function loadPublishedPosts(){
  try{
    const endpoint='https://yqmrunstyhrhnvxoyrap.supabase.co/rest/v1/articles?status=eq.published&select=title,slug,content,excerpt,image_url,category,created_at&order=created_at.desc';
    const res=await fetch(endpoint,{headers:{apikey:themeKey}});
    if(!res.ok)throw Error('Articles request failed');
    const rows=await res.json();
    if(!Array.isArray(rows))return;
    const existing=new Set(posts.map(p=>p.slug));
    for(const p of rows){
      if(!p.slug||!p.title||existing.has(p.slug))continue;
      existing.add(p.slug);
      const paragraphs=String(p.content||'').split(/\\n\\s*\\n/).map(x=>x.trim()).filter(Boolean);
      posts.unshift({slug:p.slug,title:p.title,category:p.category||'Crochet Tips',date:p.created_at?new Date(p.created_at).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}):'',minutes:Math.max(1,Math.ceil(String(p.content||'').split(/\\s+/).length/200)),image:safeHttps(p.image_url)||imageBase+'photo-1606761568499-6d2451b23c66?w=1000',excerpt:p.excerpt||'',sections:paragraphs.map(text=>['',text])});
      if(!categories.includes(p.category)&&p.category)categories.push(p.category);
    }
    route();
  }catch(err){console.warn('Using built-in articles:',err.message)}
}
let filter="All",query="";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const card=p=>`<article class="card"><a href="#post/${p.slug}"><img loading="lazy" src="${p.image}" alt="${esc(p.title)}"></a><div class="card-body"><span class="tag">${esc(p.category)}</span><h3><a href="#post/${p.slug}">${esc(p.title)}</a></h3><p>${esc(p.excerpt)}</p><a class="text-link" href="#post/${p.slug}">Read article →</a><div class="meta">${p.date} · ${p.minutes} min read</div></div></article>`;
function home(){document.title=siteTheme.site_name+" | Free Crochet Patterns, Tutorials & Ideas";document.querySelector('meta[name="description"]').content=siteTheme.site_description;document.getElementById("app").innerHTML=`
<section class="hero" id="home"><div class="container hero-inner"><div><span class="eyebrow">Your cozy corner of creativity</span><h1>Made with yarn. Shared with love.</h1><p>Explore beginner-friendly crochet tutorials, helpful tips, free project ideas, and the little joys of handmade living.</p><a class="btn" href="#articles">Explore Articles</a></div><img src="${imageBase}photo-1606761568499-6d2451b23c66?w=1200" alt="Yarn and cozy handmade crafts"></div></section>
<section class="section" id="articles"><div class="container"><div class="section-head"><div><span class="eyebrow">Fresh inspiration</span><h2>Latest Crochet Articles</h2></div><span>Learn one stitch at a time ♡</span></div><div class="controls" id="categories"><input class="search" id="search" aria-label="Search articles" placeholder="Search articles..." value="${esc(query)}"><div class="chips">${categories.map(c=>`<button class="chip ${filter===c?"active":""}" data-category="${esc(c)}">${esc(c)}</button>`).join("")}</div></div><div class="grid" id="postGrid"></div></div></section>
<div id="categorySections"></div><section class="section feature" id="about"><div class="container feature-inner"><img loading="lazy" src="${imageBase}photo-1494438639946-1ebd1d20bf85?w=1000" alt="Cozy creative workspace"><div><span class="eyebrow">Hello, maker!</span><h2>A Little About CozyLoops</h2><p>CozyLoops is a crochet inspiration blog dedicated to approachable techniques, project ideas and the pleasure of making things by hand. Whether you are learning your first chain or exploring amigurumi, there is always something new to try.</p><a class="btn" href="#articles">Start Exploring</a></div></div></section>
<section class="newsletter"><div class="container"><span class="eyebrow">Stay inspired</span><h2>Join Our Cozy Community</h2><p>Newsletter registration is coming soon. For now, bookmark CozyLoops for new articles.</p><form id="newsletterForm"><input type="email" required placeholder="Your email address" aria-label="Email address"><button class="btn" type="submit">Join the List</button></form><p class="notice" id="newsletterMessage">No emails are collected yet.</p></div></section>`;document.getElementById("search").addEventListener("input",e=>{query=e.target.value;drawCards()});document.querySelectorAll("[data-category]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.category;document.querySelectorAll("[data-category]").forEach(x=>x.classList.toggle("active",x===b));drawCards()}));document.getElementById("newsletterForm").addEventListener("submit",e=>{e.preventDefault();document.getElementById("newsletterMessage").textContent="Newsletter signup is not enabled yet. Please check back later."});drawCards();drawCategorySections()}
function drawCards(){const list=posts.filter(p=>(filter==="All"||p.category===filter)&&(p.title+" "+p.excerpt+" "+p.category).toLowerCase().includes(query.toLowerCase()));document.getElementById("postGrid").innerHTML=list.length?list.map(card).join(""):'<p class="empty">No articles found. Try another search.</p>'}
function drawCategorySections(){
  const root=document.getElementById('categorySections');if(!root)return;
  root.innerHTML=categories.filter(c=>c!=='All').map(c=>{
    const items=posts.filter(p=>p.category===c);
    if(!items.length)return '';
    return `<section class="category-section" id="section-${esc(c.toLowerCase().replace(/[^a-z0-9]+/g,'-'))}"><div class="container"><div class="section-head"><div><span class="eyebrow">Explore by category</span><h2>${esc(c)}</h2></div><a class="btn" href="#category/${encodeURIComponent(c)}">View All →</a></div><div class="grid">${items.slice(0,3).map(card).join('')}</div></div></section>`;
  }).join('');
}
function categoryPage(category){
  if(!categories.includes(category)||category==='All'){notFound();return;}
  document.title=category+' | '+siteTheme.site_name;
  const items=posts.filter(p=>p.category===category);
  document.getElementById('app').innerHTML=`<section class="section"><div class="container"><a class="text-link" href="#home">← Home</a><h1>${esc(category)}</h1><p>${items.length} article(s)</p><div class="grid">${items.map(card).join('')}</div></div></section>`;
}
function article(slug){const p=posts.find(x=>x.slug===slug);if(!p){notFound();return}document.title=p.title+" | "+siteTheme.site_name;document.querySelector('meta[name="description"]').content=p.excerpt;document.getElementById("app").innerHTML=`<article class="article"><a class="back" href="#articles">← Back to all articles</a><div class="tag">${esc(p.category)}</div><h1>${esc(p.title)}</h1><p class="meta">${p.date} · ${p.minutes} min read</p><p>${esc(p.excerpt)}</p><img src="${p.image}" alt="${esc(p.title)}"><div class="disclaimer">A friendly learning guide. Always check yarn labels and adapt instructions to your project.</div>${p.sections.map(s=>`<h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>`).join("")}<h2>Keep Creating</h2><p>Every project is a chance to learn. Explore more beginner-friendly ideas and keep practicing at your own pace.</p><a class="btn" href="#articles">Browse More Articles</a></article>`}
function simplePage(title,content){document.title=title+" | "+siteTheme.site_name;document.getElementById("app").innerHTML=`<article class="article"><a class="back" href="#home">← Home</a><h1>${title}</h1>${content}</article>`}
function notFound(){simplePage("Page not found","<p>We couldn't find that page. Browse our crochet articles instead.</p>")}
let publicContact=[];
async function loadPublicContact(){
 try{
  const endpoint='https://yqmrunstyhrhnvxoyrap.supabase.co/rest/v1/social_links?platform=in.(email,whatsapp)&is_visible=eq.true&select=platform,url';
  const response=await fetch(endpoint,{headers:{apikey:themeKey}});
  if(!response.ok)throw Error('Contact request failed');
  const rows=await response.json();
  publicContact=Array.isArray(rows)?rows:[];
  if(location.hash==='#contact')route();
 }catch(error){console.warn('Contact unavailable:',error.message);}
}
function contactPage(){
 const links=publicContact.map(item=>{
  if(item.platform==='email'){
   const email=String(item.url||'').trim();
   if(!email.includes('@')||email.includes(' '))return '';
   return '<p><strong>Email:</strong> <a class="text-link" href="mailto:'+encodeURIComponent(email)+'">'+esc(email)+'</a></p>';
  }
  const url=safeHttps(item.url);
  if(!url||new URL(url).hostname!=='wa.me')return '';
  return '<p><a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Contact us on WhatsApp</a></p>';
 }).join('');
 simplePage('Contact',links||'<p>Contact details are not available yet. Please check back later.</p>');
}
function route(){const path=decodeURIComponent(location.hash.slice(1));if(path.startsWith("post/"))article(path.slice(5));else if(path.startsWith("category/"))categoryPage(decodeURIComponent(path.slice(9)));else if(path==="privacy")simplePage("Privacy Policy",'<p>This demonstration site does not currently offer accounts, process payments, collect newsletter subscriptions, or use an advertising network. Images are loaded from an external image provider, which may receive technical request information. If analytics, ads, forms, or other services are added, this policy must be updated before launch.</p><p>For privacy questions, please use the contact information once published.</p>');else if(path==="terms")simplePage("Terms of Use",'<p>Articles are provided for general educational purposes. Results vary by materials, experience and tension. Please use appropriate safety precautions with tools and handmade items.</p><p>Original article text is provided for reading and personal learning. Contact details and site-specific legal information should be finalized before public launch.</p>');else if(path==="contact")contactPage();else home();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);route();loadTheme();loadPublishedPosts();loadPublicContact();
</script>
</body></html>
