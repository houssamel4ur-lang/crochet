name: Browser UI Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin/index.html'
      - 'admin/app.js'
      - 'tests/browser-smoke.cjs'
      - 'tests/scheduling.cjs'
      - 'scripts/article_analytics.js'
      - 'scripts/site_navigation.js'
      - 'scripts/build_seo.py'
      - 'posts/**'
      - 'tests/mock-admin-supabase.mjs'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Prepare crisp project illustrations for local browser tests
        run: python3 scripts/build_crisp_editorial_panels.py
      - name: Refresh Content Security Policy for current admin script
        run: python3 scripts/security_policy.py
      - name: Serve local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cozyloops-http.log 2>&1 &
          echo $! > /tmp/cozyloops-http.pid
          sleep 2
          curl --fail http://127.0.0.1:8765/ >/dev/null
      - name: Test scheduled publishing controls safely in memory
        run: node tests/scheduling.cjs
      - name: Test desktop mobile search navigation posts and admin access
        run: node tests/browser-smoke.cjs
