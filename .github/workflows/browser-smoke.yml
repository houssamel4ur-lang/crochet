name: Browser UI Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin/index.html'
      - 'tests/browser-smoke.cjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cozyloops-http.log 2>&1 &
          echo $! > /tmp/cozyloops-http.pid
          sleep 2
          curl --fail http://127.0.0.1:8765/ >/dev/null
      - name: Test desktop mobile search navigation posts and admin access
        run: node tests/browser-smoke.cjs
