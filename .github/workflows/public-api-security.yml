name: Public Supabase Security Checks

on:
  push:
    branches: [main]
    paths:
      - 'tests/public_api_security.py'
      - 'admin/index.html'
      - 'scripts/security_policy.py'
      - '.github/workflows/public-api-security.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  public-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public database access without changing any rows
        run: python tests/public_api_security.py
