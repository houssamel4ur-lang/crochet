name: Live Deployed Browser Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-legal-browser.yml'
      - 'tests/live_legal_browser.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out browser test
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check all nine production URLs at 390px and 1024px
        run: node tests/live_legal_browser.cjs
      - name: Upload real browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cozyloops-live-legal-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
