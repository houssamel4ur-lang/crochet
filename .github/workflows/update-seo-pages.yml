name: Update SEO article pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_seo.py'
      - '.github/workflows/update-seo-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: cozyloops-seo-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build published article pages and sitemap
        run: python scripts/build_seo.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update SEO pages from published CozyLoops articles"
            git push
          fi
