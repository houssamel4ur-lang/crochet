name: Update SEO article pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/build_seo.py'
      - 'scripts/refine_legacy_images.py'
      - 'scripts/build_card_thumbnails.py'
      - 'scripts/make_starfish_art.py'
      - 'scripts/generate_new15_assets.py'
      - 'scripts/new15_article_data.py'
      - 'editorial_sources_new15/**'
      - 'content/github_articles.json'
      - '.github/workflows/update-seo-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: cozyloops-seo-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and publish generated SEO pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Regenerate from the newest main on every attempt. Rebasing generated
          # HTML over changed generated HTML creates avoidable merge conflicts.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -m pip install --disable-pip-version-check Pillow==12.0.0
            python scripts/make_starfish_art.py
            python scripts/generate_new15_assets.py --images-only
            python scripts/refine_legacy_images.py
            python scripts/build_seo.py
            python scripts/build_card_thumbnails.py
            git add -A posts/ sitemap.xml assets/ content/github_articles.json
            if git diff --cached --quiet; then
              echo "SEO pages already up to date."
              exit 0
            fi
            git commit -m "Update SEO pages from published CozyLoops articles"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during SEO build (attempt $attempt); rebuilding."
            sleep 3
          done
          echo "Could not push generated SEO files after 4 attempts" >&2
          exit 1
