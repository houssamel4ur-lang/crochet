name: Verify Crochet2 Supabase Before Migration

on:
  push:
    branches: [main]
    paths:
      - 'tests/new_supabase_preflight.py'
      - '.github/workflows/verify-crochet2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public content, schema, and settings without database writes
        run: python tests/new_supabase_preflight.py
