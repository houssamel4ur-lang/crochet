name: CozyLoops Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check legacy-cover generation without altering the repository
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.0.0 CairoSVG==2.8.2
          python -m py_compile scripts/build_seo.py scripts/refine_legacy_images.py
          python scripts/refine_legacy_images.py
          python scripts/rasterize_editorial_covers.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          covers = list(Path('assets/legacy-polished').glob('*-cover.webp'))
          assert len(covers) == 7, f'Expected 7 polished covers, got {len(covers)}'
          for path in covers:
              with Image.open(path) as im:
                  assert im.size == (1200,720), (path,im.size)
                  assert im.format == 'WEBP', path
                  print(path, im.size, path.stat().st_size)
          PY
      - name: Generate crisp original vector reference panels
        run: python scripts/build_crisp_editorial_panels.py
      - name: Refresh admin CSP hash for changed inline scripts
        run: python scripts/security_policy.py
      - name: Validate SEO, structure and article integrity
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit every published article for broken local media and SEO links
        run: python scripts/audit_editorial.py
      - name: Validate optional Cloudflare edge protections
        run: node --test tests/security-edge.test.cjs
      - name: Validate public JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const page = fs.readFileSync('index.html', 'utf8');
          const script = page.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw new Error('Public script missing');
          new vm.Script(script[1], {filename:'index.html'});
          const admin = fs.readFileSync('admin/index.html', 'utf8');
          if (!admin.includes('<script type="module" src="./app.js"></script>')) throw new Error('Admin external script missing');
          const js = fs.readFileSync('admin/app.js', 'utf8').replace(/^import .*?;\s*$/gm,'');
          new vm.Script('(async()=>{' + js + '})', {filename:'admin/index.html'});
          const article = fs.readFileSync('scripts/article_analytics.js', 'utf8');
          new vm.Script(article, {filename:'scripts/article_analytics.js'});
          console.log('Public, admin and article JavaScript syntax valid');
          NODE
